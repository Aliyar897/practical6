### Step 2: Commit and Push
Once you've updated the file, run these commands in your PowerShell terminal to commit and push the changes to GitHub[cite: 11]:

```bash
git add .github/workflows/testWorkflow.yaml
git commit -m "Add Azure login step to workflow"
git push origin main
```[cite: 11]

After pushing, go to your GitHub repository's **Actions** tab in your browser, click on the workflow run, and let me know what result you see!